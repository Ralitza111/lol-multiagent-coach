[pytest]
# Pytest configuration for LoL Coach Agent tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    
# Minimum version
minversion = 6.0

# Test paths
testpaths = tests

# Markers for organizing tests
markers =
    unit: Unit tests for individual components
    integration: Integration tests for end-to-end functionality
    router: Tests for routing logic
    agents: Tests for agent functionality
    error: Tests for error handling
    slow: Tests that take longer to run

# Coverage options (if using pytest-cov)
# Run with: pytest --cov=. --cov-report=html
[coverage:run]
source = .
omit = 
    */tests/*
    */venv/*
    */__pycache__/*
    */site-packages/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
